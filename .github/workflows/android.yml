name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Generate Android Project via Capacitor
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android --legacy-peer-deps
          rm -f capacitor.config.ts capacitor.config.js capacitor.config.json
          echo '{"appId": "com.ebookgengk.app", "appName": "EbookGen", "webDir": "dist"}' > capacitor.config.json
          npx cap add android
          npx cap sync

      - name: Build with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
