### \u092A\u094D\u0930\u0936\u093E\u0938\u0915 \u0914\u0930 \u0909\u092A\u0930\u093E\u091C\u094D\u092F\u092A\u093E\u0932

\u0905\u0927\u093F\u0915\u093E\u0902\u0936 \u0938\u0902\u0918 \u0930\u093E\u091C\u094D\u092F \u0915\u094D\u0937\u0947\u0924\u094D\u0930\u094B\u0902 \u092E\u0947\u0902 \u0930\u093E\u0937\u094D\u091F\u094D\u0930\u092A\u0924\u093F \u0915\u093E \u092A\u094D\u0930\u0924\u093F\u0928\u093F\u0927\u093F **\u092A\u094D\u0930\u0936\u093E\u0938\u0915** \u0939\u094B\u0924\u093E \u0939\u0948\u0964 \u0926\u093F\u0932\u094D\u0932\u0940, \u092A\u0941\u0926\u0941\u091A\u0947\u0930\u0940, \u091C\u092E\u094D\u092E\u0942-\u0915\u0936\u094D\u092E\u0940\u0930 \u0914\u0930 \u0905\u0902\u0921\u092E\u093E\u0928-\u0928\u093F\u0915\u094B\u092C\u093E\u0930 \u092E\u0947\u0902 \u092F\u0939 \u092A\u0926 **\u0909\u092A\u0930\u093E\u091C\u094D\u092F\u092A\u093E\u0932** \u0915\u0939\u0932\u093E\u0924\u093E \u0939\u0948\u0964

> \u0924\u0925\u094D\u092F: \u0926\u093F\u0932\u094D\u0932\u0940 \u0915\u094B \u0905\u0928\u0941\u091A\u094D\u091B\u0947\u0926 239AA \u0915\u0947 \u0905\u0902\u0924\u0930\u094D\u0917\u0924 "\u0930\u093E\u0937\u094D\u091F\u094D\u0930\u0940\u092F \u0930\u093E\u091C\u0927\u093E\u0928\u0940 \u0915\u094D\u0937\u0947\u0924\u094D\u0930" \u0915\u093E \u0926\u0930\u094D\u091C\u093E \u092A\u094D\u0930\u093E\u092A\u094D\u0924 \u0939\u0948\u0964

# \u0909\u091A\u094D\u091A \u0928\u094D\u092F\u093E\u092F\u093E\u0932\u092F \u0915\u094D\u0937\u0947\u0924\u094D\u0930\u093E\u0927\u093F\u0915\u093E\u0930

\u0938\u0902\u0918 \u0930\u093E\u091C\u094D\u092F \u0915\u094D\u0937\u0947\u0924\u094D\u0930\u094B\u0902 \u0915\u0947 \u0932\u093F\u090F \u0905\u0932\u0917 \u0909\u091A\u094D\u091A \u0928\u094D\u092F\u093E\u092F\u093E\u0932\u092F \u0938\u0940\u092E\u093F\u0924 \u0939\u0948\u0902; \u0905\u0927\u093F\u0915\u093E\u0902\u0936 \u0915\u094D\u0937\u0947\u0924\u094D\u0930 \u0915\u093F\u0938\u0940 \u092A\u0921\u093C\u094B\u0938\u0940 \u0930\u093E\u091C\u094D\u092F \u0915\u0947 \u0909\u091A\u094D\u091A \u0928\u094D\u092F\u093E\u092F\u093E\u0932\u092F \u0915\u0947 \u0905\u0927\u0940\u0928 \u0906\u0924\u0947 \u0939\u0948\u0902\u0964

## \u092A\u0930\u0940\u0915\u094D\u0937\u093E-\u0909\u092A\u092F\u094B\u0917\u0940 \u092C\u093F\u0902\u0926\u0941
